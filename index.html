<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giant File Editor</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="toolbar">
      <button id="open-btn">Open File…</button>
      <span id="file-name">No file open</span>
      <input id="search-input" placeholder="Find in file..." />
      <button id="search-btn">Search</button>
      <button id="prev-hit" title="Previous match (Shift+Enter)" disabled>
        ▲
      </button>
      <button id="next-hit" title="Next match (Enter)" disabled>▼</button>
      <span id="hit-counter"></span>
      <label class="toggle">
        <input type="checkbox" id="match-case" />
        Match case
      </label>
      <label class="toggle">
        <input type="checkbox" id="word-wrap" />
        Wrap
      </label>
      <span id="status"></span>
    </div>
    <div id="editor-wrap">
      <div id="editor-container"></div>
      <div id="vscroll"><div id="vthumb"></div></div>
    </div>
  </body>
</html>
