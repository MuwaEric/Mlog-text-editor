<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giant File Editor</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="toolbar">
      <details id="actions-menu">
        <summary title="Application menu">☰</summary>
        <div class="actions-list">
          <button id="open-btn" class="menu-item" type="button" title="Open File (Ctrl+O)">
            <span class="menu-icon">↗</span><span>Open File…</span><span class="menu-shortcut">Ctrl+O</span>
          </button>
          <div class="menu-separator"></div>
          <button id="save-btn" class="menu-item" type="button" disabled title="Save (Ctrl+S)">
            <span class="menu-icon">↓</span><span>Save</span><span class="menu-shortcut">Ctrl+S</span>
          </button>
          <button id="save-as-btn" class="menu-item" type="button" title="Save As (Ctrl+Shift+S)">
            <span class="menu-icon">⇩</span><span>Save As…</span><span class="menu-shortcut">Ctrl+Shift+S</span>
          </button>
          <div class="menu-separator"></div>
          <button id="undo-btn" class="menu-item" type="button" disabled title="Undo (Ctrl+Z)">
            <span class="menu-icon">↶</span><span>Undo</span><span class="menu-shortcut">Ctrl+Z</span>
          </button>
          <button id="redo-btn" class="menu-item" type="button" disabled title="Redo (Ctrl+Y)">
            <span class="menu-icon">↷</span><span>Redo</span><span class="menu-shortcut">Ctrl+Y</span>
          </button>
          <button id="goto-btn" class="menu-item" type="button" title="Go To line or byte (Ctrl+G)">
            <span class="menu-icon">⌖</span><span>Go To…</span><span class="menu-shortcut">Ctrl+G</span>
          </button>
          <div class="menu-separator"></div>
          <button id="prefs-btn" class="menu-item" type="button" title="Preferences">
            <span class="menu-icon">⚙</span><span>Preferences…</span><span class="menu-shortcut"></span>
          </button>
        </div>
      </details>
      <span id="file-name" title="Current document">No file open</span>
      <label class="switch">
        <input type="checkbox" id="word-wrap" />
        <span class="switch-track"><span class="switch-knob"></span></span>
        <span class="switch-text">Wrap</span>
      </label>
    </div>
    <div id="editor-wrap">
      <div id="editor-container"></div>
      <div id="vscroll"><div id="vthumb"></div></div>
    </div>
    <div id="findbar">
      <input id="search-input" placeholder="Find in file…" />
      <button id="search-btn">Search</button>
      <button id="prev-hit" title="Previous match (Shift+Enter)" disabled>
        ▲
      </button>
      <button id="next-hit" title="Next match (Enter)" disabled>▼</button>
      <span id="hit-counter"></span>
      <label class="switch">
        <input type="checkbox" id="match-case" />
        <span class="switch-track"><span class="switch-knob"></span></span>
        <span class="switch-text">Match case</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="whole-word" />
        <span class="switch-track"><span class="switch-knob"></span></span>
        <span class="switch-text">Whole word</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="regex-search" />
        <span class="switch-track"><span class="switch-knob"></span></span>
        <span class="switch-text">Regex</span>
      </label>
      <span id="position" aria-live="polite">Ln 1, Col 1</span>
      <span id="status"></span>
    </div>

    <div id="prefs-overlay" hidden>
      <div id="prefs-panel" role="dialog" aria-label="Preferences">
        <h2>Preferences</h2>

        <label class="pref-row">
          <span>Theme</span>
          <select id="pref-theme">
            <option value="vs">Light</option>
            <option value="vs-dark">Dark</option>
            <option value="hc-light">High contrast light</option>
            <option value="hc-black">High contrast dark</option>
          </select>
        </label>

        <label class="pref-row">
          <span>Font size</span>
          <input type="number" id="pref-font-size" min="8" max="40" step="1" />
        </label>

        <label class="pref-row">
          <span>Font family</span>
          <input type="text" id="pref-font-family" placeholder="default" />
        </label>

        <label class="pref-row">
          <span>Font ligatures</span>
          <input type="checkbox" id="pref-ligatures" />
        </label>

        <label class="pref-row">
          <span>Cursor style</span>
          <select id="pref-cursor-style">
            <option value="line">Line</option>
            <option value="line-thin">Line (thin)</option>
            <option value="block">Block</option>
            <option value="block-outline">Block (outline)</option>
            <option value="underline">Underline</option>
            <option value="underline-thin">Underline (thin)</option>
          </select>
        </label>

        <label class="pref-row">
          <span>Tab size</span>
          <input type="number" id="pref-tab-size" min="1" max="16" step="1" />
        </label>

        <label class="pref-row">
          <span>Wrap long lines</span>
          <input type="checkbox" id="pref-word-wrap" />
        </label>

        <label class="pref-row">
          <span>Show line numbers</span>
          <input type="checkbox" id="pref-line-numbers" />
        </label>

        <label class="pref-row">
          <span>Show minimap</span>
          <input type="checkbox" id="pref-minimap" />
        </label>

        <label class="pref-row">
          <span>Show whitespace</span>
          <input type="checkbox" id="pref-whitespace" />
        </label>

        <label class="pref-row">
          <span>Show control characters</span>
          <input type="checkbox" id="pref-control-chars" />
        </label>

        <label class="pref-row">
          <span>Bracket pair colorization</span>
          <input type="checkbox" id="pref-bracket-colors" />
        </label>

        <label class="pref-row">
          <span>Sticky scroll</span>
          <input type="checkbox" id="pref-sticky-scroll" />
        </label>

        <label class="pref-row">
          <span>Search is case-sensitive by default</span>
          <input type="checkbox" id="pref-match-case" />
        </label>

        <label class="pref-row">
          <span>Viewport window (lines)</span>
          <input
            type="number"
            id="pref-window-lines"
            min="500"
            max="20000"
            step="500"
          />
        </label>
        <p class="pref-hint">
          Lines kept in the editor at once. Larger means less reloading while
          scrolling but more memory; lower it for files with very long lines.
          Hard cap: 20,000 lines. The file itself is never fully loaded.
        </p>

        <div class="pref-actions">
          <button id="prefs-reset">Reset to defaults</button>
          <button id="prefs-close">Close</button>
        </div>
      </div>
    </div>
  </body>
</html>
